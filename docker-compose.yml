# docker-compose.yml
# Spins up MinIO (S3-compatible storage) and MongoDB for local development.
# Run: docker compose up -d

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: fileclip-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ── MinIO (S3-compatible) ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fileclip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  minio_data:

